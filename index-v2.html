<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBITUARY — The Museum of Useful Links</title>
<meta name="description" content="192 hand-picked links in a station that is quietly coming apart: forty-seven rooms, a cellar, and the Earth going past under the Cupola. A walkable museum in one file.">
<style>
  :root {
    /* the same six tokens the hull is painted with, on the paper side of the
       glass. panel is what you are meant to read; panel-shadow is the seams
       and the secondary text, and it runs at an alpha because at full
       strength it is nearly as loud as the ink and a HUD with no second voice
       shouts; void is the ground everything sits on; the two accents are the
       parts of the interface that are hardware rather than prose.
       The panels sit a little more opaque than they were: the canvas behind
       them now carries a 3% scanline, and at 0.62 the pattern showed through
       the glass under 9px monospace. The type itself is untouched — that half
       of the spec has not landed. */
    --void: #0A0A0C;
    --panel-face: #F4F4F5;
    --panel-seam: #D6D6DA;
    --signal: #00E5FF;
    --amber: #FFB700;
    --ink: #F4F4F5;
    --dim: rgba(214, 214, 218, 0.72);
    --line: rgba(244, 244, 245, 0.16);
    --panel: rgba(10, 10, 12, 0.72);
    --wing: #FFB700;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--void); }
  body {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .kicker {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 10px; letter-spacing: 0.22em; color: var(--dim); text-transform: uppercase;
  }

  /* ── room card ── */
  .card {
    position: absolute; left: 26px; top: 24px; max-width: 46vw;
    padding: 14px 18px 16px; border-left: 2px solid var(--wing);
    background: linear-gradient(90deg, var(--panel), rgba(10, 10, 12, 0));
    backdrop-filter: blur(3px);
  }
  .card.flash { animation: flash 900ms ease-out; }
  @keyframes flash {
    0% { border-left-color: var(--panel-face); transform: translateX(-6px); opacity: 0.4; }
    100% { border-left-color: var(--wing); transform: none; opacity: 1; }
  }
  .brand { font-size: 10px; letter-spacing: 0.3em; color: var(--dim); font-family: ui-monospace, monospace; }
  .room-name { font-size: 30px; line-height: 1.1; margin: 6px 0 2px; letter-spacing: 0.01em; }
  .room-sub { font-size: 12.5px; color: var(--dim); font-style: italic; }

  /* ── sky dial ── */
  .skybox {
    position: absolute; right: 26px; top: 24px; width: 268px; padding: 12px 14px 14px;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
    opacity: 0.34; transition: opacity 260ms ease;
  }
  .skybox:hover, .hud.sky-open .skybox { opacity: 1; pointer-events: auto; }
  /* the track readout is live data, and live data is cyan in this palette.
     only the label over the panel takes it: the seven buttons stay exactly
     the chips they were, because they are controls, not readings. */
  .skybox .kicker { color: var(--signal); }
  .sky-name { font-size: 19px; margin: 3px 0 1px; }
  .sky-clock { font-size: 11px; color: var(--dim); font-family: ui-monospace, monospace; }
  .dial { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0 8px; }
  .chip {
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.06em;
    color: var(--ink); background: rgba(214, 214, 218, 0.06);
    border: 1px solid var(--line); padding: 4px 7px; cursor: pointer;
  }
  .chip:hover { background: rgba(214, 214, 218, 0.16); }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mini { font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.18em; color: var(--dim); }
  .time { flex: 1 1 100%; height: 3px; appearance: none; background: var(--line); cursor: pointer; }
  .time::-webkit-slider-thumb { appearance: none; width: 11px; height: 11px; background: var(--wing); border-radius: 50%; }
  .toggle { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .toggle input { accent-color: var(--wing); }

  /* ── floor plan ── */
  .mapbox {
    position: absolute; left: 26px; bottom: 62px; width: 208px; padding: 10px 10px 6px;
    background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(6px);
  }
  .mapbox svg { display: block; margin-top: 6px; }
  .mapbox .rot { fill: rgba(214, 214, 218, 0.07); stroke: rgba(214, 214, 218, 0.35); stroke-width: 0.35; }
  .mapbox .corr { fill: none; stroke: rgba(214, 214, 218, 0.30); stroke-width: 0.3; }
  .mapbox .roomrect { stroke-width: 0.3; }
  .mapbox .you { fill: var(--panel-face); }
  .map-hint { font-family: ui-monospace, monospace; font-size: 9px; color: var(--dim); letter-spacing: 0.1em; }
  /* the zone key: eight colours rather than forty-seven, and the count of
     doors each one owns, so the map can be read rather than admired */
  .zonekey { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; margin-top: 7px; }
  .zk { display: flex; align-items: center; gap: 4px; font-family: ui-monospace, monospace; font-size: 8.5px; letter-spacing: 0.06em; color: var(--dim); }
  .zk i { width: 6px; height: 6px; display: inline-block; }
  .zk-code { color: var(--ink); }
  .zk-n { margin-left: auto; }

  /* ── plaque ── */
  .plaque {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    width: min(560px, 74vw); padding: 14px 18px 12px;
    background: var(--panel); border: 1px solid var(--line); border-bottom: 2px solid var(--wing);
    backdrop-filter: blur(6px);
  }
  .plaque-title { font-size: 24px; margin: 4px 0 3px; }
  .plaque-cost { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.16em; color: var(--amber); }
  .plaque-text { font-size: 14px; line-height: 1.5; color: rgba(214, 214, 218, 0.86); margin: 5px 0 3px; }
  .plaque-note { font-size: 12px; color: var(--dim); font-family: ui-monospace, monospace; }
  .plaque-go {
    margin-top: 8px; font-family: ui-monospace, monospace; font-size: 9.5px;
    letter-spacing: 0.16em; color: var(--wing);
  }

  /* ── bottom bar ── */
  .bar {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42px;
    display: flex; align-items: center; gap: 16px; padding: 0 26px;
    background: linear-gradient(0deg, rgba(10, 10, 12, 0.86), rgba(10, 10, 12, 0));
  }
  .keys { font-size: 11.5px; color: var(--dim); }
  .keys b { color: var(--ink); font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 600; }
  .meter { display: flex; gap: 2px; margin-left: auto; }
  .meter i { width: 3px; height: 9px; background: rgba(214, 214, 218, 0.14); }
  .meter i.on { background: var(--wing); }
  .stats { font-family: ui-monospace, monospace; font-size: 10px; color: var(--dim); letter-spacing: 0.08em; }

  /* ── toasts ── */
  .toasts { position: absolute; right: 26px; bottom: 62px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .toast {
    font-size: 12.5px; padding: 7px 12px; background: var(--panel);
    border-left: 2px solid var(--wing); opacity: 0; transform: translateY(6px);
    transition: opacity 320ms ease, transform 320ms ease; max-width: 40vw;
  }
  .toast.in { opacity: 1; transform: none; }

  /* ── the door: the ticket, then the brochure ─────────────────────────
      Both are paper. Everything else on the page is glass over a dark hull,
      and the one thing a museum hands you at the door is a printed sheet —
      so the ticket and the brochure are the only white surfaces in the whole
      interface, and they are the only places the palette runs on ink.
      Tearing the ticket is an iris closing over it rather than a fade: the
      identity spec asks for a shutter, and a shutter is what a station door
      is. */
  .intro {
    position: absolute; inset: 0; display: grid; place-items: center;
    padding: 24px; overflow: auto;
    background: radial-gradient(120% 90% at 50% 40%, rgba(10, 10, 12, 0.62), rgba(10, 10, 12, 0.96));
    pointer-events: auto;
  }
  .intro.gone { opacity: 0; pointer-events: none; }
  .intro.torn { animation: iris 620ms cubic-bezier(.6, 0, .2, 1) forwards; }
  @keyframes iris {
    0% { clip-path: circle(140% at 50% 50%); opacity: 1; }
    55% { clip-path: circle(30% at 50% 50%); opacity: 1; }
    100% { clip-path: circle(0% at 50% 50%); opacity: 0.15; }
  }
  .intro-kicker { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.34em; }

  .ticket {
    width: min(660px, 94vw); background: var(--panel-face); color: var(--void);
    padding: 26px 30px 24px; border-top: 3px solid var(--amber);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.62);
  }
  .ticket-head {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.2em; color: #5a5a63;
  }
  .ticket h1 { font-size: clamp(28px, 4.6vw, 46px); line-height: 1.05; font-weight: 400; margin: 12px 0 6px; }
  .ticket-count { font-family: ui-monospace, monospace; font-size: 11px; letter-spacing: 0.06em; color: #5a5a63; }
  .perf { position: relative; margin: 22px 0 16px; border-top: 1px dashed rgba(10, 10, 12, 0.45); }
  .perf span {
    position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    background: var(--panel-face); padding: 0 10px;
    font-family: ui-monospace, monospace; font-size: 9px; letter-spacing: 0.2em;
    text-transform: uppercase; color: #6b6b74;
  }
  .ticket-rules { margin: 0 0 18px; padding-left: 22px; }
  .ticket-rules li { margin-bottom: 9px; font-size: 13px; line-height: 1.52; color: #3a3a42; }
  .ticket-rules b { display: block; color: var(--void); font-size: 13px; }
  .stamp {
    display: block; width: 100%; padding: 13px 16px; border: 0; cursor: pointer;
    background: var(--void); color: var(--panel-face);
    font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: 0.26em;
  }
  .stamp:hover { background: #17171c; box-shadow: inset 0 0 0 1px var(--amber); }
  .ticket-foot { margin-top: 12px; text-align: center; font-size: 11px; font-style: italic; color: #6b6b74; }

  .brochure {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 24px;
    background: rgba(10, 10, 12, 0.74); backdrop-filter: blur(4px);
    pointer-events: auto; animation: sheet 420ms ease-out;
  }
  @keyframes sheet { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .brochure-inner {
    width: min(760px, 94vw); max-height: 86vh; overflow: auto; padding: 24px 30px 28px;
    background: var(--panel-face); color: var(--void); border-top: 3px solid var(--signal);
    box-shadow: 0 26px 70px rgba(0, 0, 0, 0.62);
  }
  .brochure-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brochure-head .kicker { color: #5a5a63; }
  .brochure-x { background: none; border: 0; cursor: pointer; font-size: 22px; line-height: 1; color: #5a5a63; }
  .brochure h2 { margin: 12px 0 4px; font-size: clamp(24px, 3.4vw, 34px); font-weight: 400; }
  .brochure-thesis { margin: 0 0 6px; font-style: italic; color: #3a3a42; }
  .brochure .kicker {
    margin: 20px 0 10px; padding-bottom: 4px; color: var(--void);
    border-bottom: 1px solid rgba(10, 10, 12, 0.18);
  }
  .brochure p { margin: 0 0 10px; font-size: 14px; line-height: 1.62; color: #2c2c33; }
  .brochure b { color: var(--void); }
  .brochure a { color: #0a6a76; }
  .brochure-keys { border-collapse: collapse; }
  .brochure-keys td { padding: 3px 14px 3px 0; font-size: 13.5px; line-height: 1.4; color: #2c2c33; vertical-align: top; }
  .brochure-keys td b { font-family: ui-monospace, monospace; font-size: 11.5px; letter-spacing: 0.08em; color: var(--void); }
  .brochure-blank { font-style: italic; color: #6b6b74; }
  .brochure-foot { font-size: 12.5px; color: #5a5a63; }
  .brochure-go {
    margin-top: 20px; width: 100%; padding: 13px; border: 0; cursor: pointer;
    background: var(--void); color: var(--panel-face);
    font-family: ui-monospace, monospace; font-size: 12px; letter-spacing: 0.26em;
  }
  .brochure-go:hover { background: #17171c; box-shadow: inset 0 0 0 1px var(--signal); }

  @media (max-width: 760px) {
    .mapbox { display: none; }
    .room-name { font-size: 22px; }
    .keys { display: none; }
  }
</style>
